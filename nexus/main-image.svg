<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="bg" cx="0.3" cy="0.5" r="0.85">
      <stop offset="0" stop-color="#1c2b33"/>
      <stop offset="0.55" stop-color="#111a1f"/>
      <stop offset="1" stop-color="#090d10"/>
    </radialGradient>
    <linearGradient id="ember" x1="347" y1="752" x2="560" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc56b"/>
      <stop offset="1" stop-color="#ff6a2b"/>
    </linearGradient>
    <filter id="fog" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- shroud fog -->
  <g filter="url(#fog)">
    <ellipse cx="1450" cy="900" rx="520" ry="180" fill="#6b3fa0" opacity="0.22"/>
    <ellipse cx="300" cy="160" rx="420" ry="140" fill="#1f6f78" opacity="0.18"/>
    <ellipse cx="1650" cy="180" rx="300" ry="120" fill="#6b3fa0" opacity="0.12"/>
  </g>

  <!-- gauge: 0 to 80 fps over 270 degrees, cap at 40 (top) -->
  <g transform="translate(-60 0)">
  <path d="M 560 240 A 300 300 0 0 1 772.13 752.13" fill="none" stroke="#24333a" stroke-width="44" stroke-linecap="round"/>
  <path d="M 347.87 752.13 A 300 300 0 0 1 560 240" fill="none" stroke="url(#ember)" stroke-width="44" stroke-linecap="round" filter="url(#glow)" opacity="0.7"/>
  <path d="M 347.87 752.13 A 300 300 0 0 1 560 240" fill="none" stroke="url(#ember)" stroke-width="44" stroke-linecap="round"/>

  <g stroke-width="6" stroke-linecap="round">
    <line x1="900" y1="540" x2="922" y2="540" stroke="#ffd9a8" opacity="0.75" transform="rotate(135 560 540)"/>
    <line x1="900" y1="540" x2="922" y2="540" stroke="#ffd9a8" opacity="0.75" transform="rotate(168.75 560 540)"/>
    <line x1="900" y1="540" x2="922" y2="540" stroke="#ffd9a8" opacity="0.75" transform="rotate(202.5 560 540)"/>
    <line x1="900" y1="540" x2="922" y2="540" stroke="#ffd9a8" opacity="0.75" transform="rotate(236.25 560 540)"/>
    <line x1="900" y1="540" x2="922" y2="540" stroke="#3b4b53" transform="rotate(303.75 560 540)"/>
    <line x1="900" y1="540" x2="922" y2="540" stroke="#3b4b53" transform="rotate(337.5 560 540)"/>
    <line x1="900" y1="540" x2="922" y2="540" stroke="#3b4b53" transform="rotate(371.25 560 540)"/>
    <line x1="900" y1="540" x2="922" y2="540" stroke="#3b4b53" transform="rotate(405 560 540)"/>
  </g>

  <!-- cap marker -->
  <line x1="560" y1="282" x2="560" y2="170" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>

  <text x="560" y="625" text-anchor="middle" font-family="Bahnschrift, 'Segoe UI', sans-serif" font-weight="600" font-size="250" fill="#ffffff">40</text>
  <text x="560" y="705" text-anchor="middle" font-family="Bahnschrift, 'Segoe UI', sans-serif" font-size="46" letter-spacing="10" fill="#9fb3bd">BASE FPS</text>
  </g>

  <!-- title -->
  <text x="930" y="390" font-family="Bahnschrift, 'Segoe UI', sans-serif" font-size="40" letter-spacing="9" fill="#ffa25a">ENSHROUDED</text>
  <text x="924" y="528" font-family="Bahnschrift, 'Segoe UI', sans-serif" font-weight="700" font-size="132" fill="#ffffff">Base FPS Cap</text>
  <text x="930" y="606" font-family="'Segoe UI', sans-serif" font-size="46" fill="#b8c7ce">Caps real frames before frame gen</text>

  <!-- chips -->
  <g font-family="Bahnschrift, 'Segoe UI', sans-serif" font-size="40" fill="#e9eef0">
    <rect x="930" y="666" width="270" height="76" rx="38" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
    <text x="1065" y="718" text-anchor="middle">2x → 80 fps</text>
    <rect x="1224" y="666" width="290" height="76" rx="38" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
    <text x="1369" y="718" text-anchor="middle">3x → 120 fps</text>
    <rect x="1538" y="666" width="210" height="76" rx="38" fill="#ff6a2b" fill-opacity="0.16" stroke="#ff8a4c" stroke-opacity="0.55" stroke-width="2"/>
    <text x="1643" y="718" text-anchor="middle" fill="#ffd2b0">F9 / F11</text>
  </g>
</svg>
