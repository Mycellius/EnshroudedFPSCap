; EnshroudedBaseCap - caps the frames the game really renders, before frame
; generation multiplies them. With BaseFpsCap=40 you get 80 fps out at 2x and
; 120 at 3x, and the GPU only renders 40 real frames a second either way.
;
; Hotkeys (only while the game has focus). Virtual-key codes:
;   F9 = 120  lower the cap by Step
;   F11 = 122 raise the cap by Step. One press past MaxCap turns the cap off;
;             F9 from "off" comes back in at MaxCap.
;   Hold a key to repeat; it speeds up after a moment. A readout at the top of the screen shows the new value
;   for ReadoutMs. Like the frame-gen mod's own overlay, it pauses G-Sync while
;   it is on screen.
;
; BaseFpsCap        real frames per second, 0 = off. Saved here when you change it in game.
; Step              how much one key press changes the cap.
; MinCap / MaxCap   range for the hotkeys. MinCap is never below 10: slower than that, the
;                   frame-gen mod takes the gaps between frames for a paused game and
;                   turns frame generation off.
; KeyToggle         optional key that flips the cap off and back on. 0 = unbound.
; WaitAfterPresent  0 = hold each real frame back until its slot, then hand it to frame
;                   gen. Most even frame spacing, so 2x/3x looks smoothest. (default)
;                   1 = hand the frame over first, then wait before the game starts the
;                   next one. A little less input lag, slightly less even spacing.
[EnshroudedBaseCap]
BaseFpsCap=40
Step=5
MinCap=10
MaxCap=300
KeyDown=120
KeyUp=122
KeyToggle=0
WaitAfterPresent=0
ShowReadout=1
ReadoutMs=2000
